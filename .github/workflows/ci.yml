name: CI/CD MLflow

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main

env:
  CSV_URL: "MLproject/preprocessed_kdd.csv"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Check Env
        run: |
          echo $CSV_URL

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mlflow project
        working-directory: Eksperimen_SML_Rudy_Eko/Workflow-CI
        run: mlflow run MLproject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(ls -td Eksperimen_SML_Rudy_Eko/Workflow-CI/mlruns/0/*/ | head -n 1 | cut -d'/' -f5)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Build Docker Model
        env:
          MLFLOW_TRACKING_URI: ${{ github.workspace }}/Eksperimen_SML_Rudy_Eko/Workflow-CI/mlruns
        run: |
          mlflow models build-docker \
            --model-uri "runs:/${{ env.RUN_ID }}/best_gnb_model" \
            --name "kdd-classify"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag kdd-classify ${{ secrets.DOCKER_HUB_USERNAME }}/kdd-classify:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/kdd-classify:latest

