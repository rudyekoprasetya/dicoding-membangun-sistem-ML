name: CI/CD MLflow

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main

env:
  CSV_URL: "preprocessed_kdd.csv"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Check Env
        run: |
          echo $CSV_URL

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mlflow project
        working-directory: Eksperimen_SML_Rudy_Eko/Workflow-CI
        run: mlflow run MLproject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          python -c "
import mlflow, os
mlflow.set_tracking_uri('${{ github.workspace }}/Eksperimen_SML_Rudy_Eko/Workflow-CI/mlruns')
exp = mlflow.get_experiment_by_name('KDD Cyber Attack Classify - Tuning')
if exp:
    runs = mlflow.search_runs(
        experiment_ids=[exp.experiment_id],
        order_by=['start_time DESC'],
        max_results=1
    )
    if not runs.empty:
        run_id = runs.iloc[0].run_id
        print(f'Latest run_id: {run_id}')
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f'RUN_ID={run_id}\n')
    else:
        print('No runs found - setting dummy')
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write('RUN_ID=none\n')
else:
    print('Experiment not found - setting dummy')
    with open(os.environ['GITHUB_ENV'], 'a') as f:
        f.write('RUN_ID=none\n')
"

      - name: Build Docker Model
        if: env.RUN_ID != 'none'
        env:
          MLFLOW_TRACKING_URI: ${{ github.workspace }}/Eksperimen_SML_Rudy_Eko/Workflow-CI/mlruns
        run: |
          mlflow models build-docker \
            --model-uri "runs:/${{ env.RUN_ID }}/best_gnb_model" \
            --name "kdd-classify"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag kdd-classify ${{ secrets.DOCKER_HUB_USERNAME }}/kdd-classify:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/kdd-classify:latest

